name: governance

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # From pyproject.toml, so CI and a newcomer install the same set. The
        # `capture` extra is deliberately not installed: those scripts need the
        # Taiwan Core checkout, which does not exist here, so the tests that
        # reach for it skip by design and say so.
        run: python -m pip install --quiet -e ".[dev]"

      - name: Run the environment-independent suite
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONIOENCODING: utf-8
        # Archives and the Taiwan Core checkout live only on the operator's
        # machine, so a runner can only prove the static and pure-logic
        # invariants. -ra lists exactly what skipped, so the boundary between
        # "checked here" and "checked locally" stays visible rather than
        # quietly shrinking.
        # No marker filter: CI runs both lanes. The `needs_local_data`
        # tests skip here for want of the warehouse, and -ra prints each
        # one by name -- the split is a speed measure for the commit
        # hook, never a reason for a check to stop being named.
        #
        # Failures are re-emitted as `::error::` annotations. The run log
        # needs a token to read, and this repository is developed on Windows
        # while the runner is Linux, so a failure that only happens here has
        # to be readable from the outside or it gets diagnosed by guesswork.
        # Three runs were guessed at before this was added.
        run: |
          set -o pipefail
          python -m pytest -q -ra 2>&1 | tee pytest-output.txt || {
            echo "::error::the suite failed on Linux; the lines below are from pytest"
            grep -E '^(FAILED|ERROR)' pytest-output.txt | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -60 pytest-output.txt
            exit 1
          }

      - name: Fail if a licensed vendor export was committed
        run: |
          if git ls-files | grep -qiE '\.zip$'; then
            echo "A .zip is tracked. Licensed vendor exports must not be committed."
            exit 1
          fi

      - name: Fail if private evidence was committed
        run: |
          if git ls-files | grep -qE '^private/'; then
            echo "A file under private/ is tracked. Private evidence must not be committed."
            exit 1
          fi

      - name: Fail if the broker is named anywhere in the tree
        # The archive is private; the identity must not leak back in through a
        # filename, an identifier or a source URL.
        #
        # m4/rules.py and m5/ledger.py are excluded and that is a hole, not a
        # decision that it is fine. They are byte-identical mirrors of Taiwan
        # Core -- an invariant test asserts it -- so editing them here alone
        # would break the mirror, and editing them upstream was declined on
        # 2026-09-01 because that checkout had uncommitted work. Recorded as
        # outstanding item 1 in docs/evidence/broker-terms-provenance-2026-08-29.md,
        # with the fix. Remove this exclusion once the upstream change lands.
        run: |
          if git grep -qiE 'sinopac|sinotrade|永豐' -- . ':!.github/workflows/ci.yml' ':!m4/rules.py' ':!m5/ledger.py'; then
            echo "The broker is named in a tracked file. See docs/evidence/broker-terms-provenance-2026-08-29.md."
            git grep -inE 'sinopac|sinotrade|永豐' -- . ':!.github/workflows/ci.yml' ':!m4/rules.py' ':!m5/ledger.py'
            exit 1
          fi
